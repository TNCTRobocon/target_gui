target_gui:
  ros__parameters:
    # 射出電流設定値を変更する shoot_belt のサービス名。
    service_name: /shoot_belt/manual_current

    # ブレーキボタンが既存の停止処理へ送るトピック名。
    stop_topic: /shoot_belt/stop

    # リセットボタンが呼び出す原点初期化サービス名 (std_srvs/srv/Trigger)。
    reset_origin_service_name: /shoot_belt/reset_origin

    # 現在の射出電流設定値 [A] を受信するトピック名。実測電流ではない。
    state_topic: /shoot_belt/manual_current_state

    # 射出Actionの受付状態を受信するトピック名。
    operation_state_topic: /shoot_belt/operation_state

    # reload action servers and their latched one-shot permission state.
    reload_execute_action_name: /reload/execute
    reload_reset_origin_action_name: /reload/reset_origin
    reload_ready_topic: /reload/ready


    # true: 全画面で起動、false: ウィンドウ表示で起動。
    full_screen: false
